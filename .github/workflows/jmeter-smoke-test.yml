name: JMeter Smoke Test

on:
  push:
    branches:
      - main
 workfllow_dispatch:

jobs:
 jmeter-test:
   runs-on: ubuntu-latest

   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          diistribution: temurin
          java-version: '17'

      - name: download apache JMeter
        run:|
          wget
http://archive.apache.org/dist/jmeter/binaries
/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

        - name: run JMeter smoke test
          run:|
            apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t "capstone smoke-test.jmx" \
            -l results.jtl \
            -e \
            -o report

      - name: upload JMeter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: |
            results.jtl
            report/
        
